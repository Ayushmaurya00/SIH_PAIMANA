# ==============================================================================
# PAIMANA AI - Docker Compose Multi-Container Orchestration
# ==============================================================================
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: paimana-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
      - DATABASE_PATH=/app/paimana.db
      - DB_RETRY_ATTEMPTS=3
      - DB_RETRY_DELAY_SEC=0.2
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paimana-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
